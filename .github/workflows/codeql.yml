# Free on public repos.

# For private repos, see https://docs.github.com/en/code-security/secure-coding/automatically-scanning-your-code-for-vulnerabilities-and-errors/about-code-scanning#about-code-scanning
# this is a code scanning workflow that uses CodeQL 
#to scan your code for vulnerabilities and errors. 
#You can customize the workflow to fit your needs. 
#For more information, see "Configuring CodeQL analysis 
#for your repository" in the GitHub Docs.
name: CodeQL
on:
  pull_request: { branches: [main] }
  push: { branches: [main] }
  schedule: [{ cron: "0 3 * * 1" }]
permissions: { contents: read, security-events: write, actions: read }
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
