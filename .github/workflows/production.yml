name: Production deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production
  cancel-in-progress: false
permissions: { contents: read }
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: { name: production, url: "${{ vars.PRODUCTION_URL }}" } # add required reviewers on this environment for a manual gate
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Vercel secrets present
        run: test -n "${{ secrets.VERCEL_TOKEN }}" -a -n "${{ secrets.VERCEL_ORG_ID }}" -a -n "${{ secrets.VERCEL_PROJECT_ID }}" || { echo "::error::Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID under Settings > Secrets and variables > Actions"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Smoke test
        env:
          URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$URL" ]; then echo "::error::Repository VARIABLE PRODUCTION_URL is empty. Add it under Settings > Secrets and variables > Actions > Variables (not Secrets), e.g. https://sports-fb.vercel.app"; exit 1; fi
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$URL/api/health"
